# /etc/ssh/sshd_config.d/10-hardening.conf
# Applied by harden-ssh.sh. Ubuntu's sshd_config includes sshd_config.d/*.conf
# at its top and sshd keeps the first value it reads, so this file wins over
# the main config and over any drop-in that sorts after it. DGX OS 7.x ships
# with an empty sshd_config.d; the 10- prefix is there so that a drop-in added
# later by a package or by cloud-init (50-cloud-init.conf) cannot re-enable
# passwords.
# Check the effective result with: sudo sshd -T | grep -Ei 'password|permitroot|kbd|pubkey|allowgroups|maxauth|x11'

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# Only members of this group may log in over SSH. Create it and add your
# admin account before reloading sshd, or you will lock yourself out.
AllowGroups sshusers
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
# local: ssh -L works (DGX Dashboard listens on 127.0.0.1:11000 only and is
# reached through a tunnel; NVIDIA Sync and VS Code Remote-SSH need it too).
# Remote forwarding (ssh -R), which exposes ports back through the node, stays off.
AllowTcpForwarding local
PermitEmptyPasswords no
